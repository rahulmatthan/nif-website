<div class="sub">
  <div class="wrap narrow">
    <p class="eyebrow">Stay connected</p>
    <h2>Get the calls, longlists and lectures</h2>
    <p>Updates on the Fellowships, the NIF Book Prize and the Girish Karnad Memorial Lecture. Roughly six emails a year.</p>
    <form action="{{ site.Params.social.newsletter }}" method="get" target="_blank" rel="noopener">
      <input type="text" name="first_name" placeholder="First name" aria-label="First name" required>
      <input type="text" name="last_name" placeholder="Last name" aria-label="Last name">
      <input type="email" name="email" placeholder="Email address" aria-label="Email address" required>
      <button class="btn" type="submit">Subscribe</button>
    </form>
    <p class="small" style="margin-top:12px">We respect your privacy. Past issues are archived on <a href="{{ site.Params.social.newsletter }}" target="_blank" rel="noopener">ScrollStack</a>.</p>
  </div>
</div>
