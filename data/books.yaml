  buy_publisher: ""
  short_description: "The life of Sachchidananda Hirananda Vatsyayan — poet, novelist, revolutionary and editor — and through him a history of twentieth-century Hindi letters."
  description: |-
    Sachchidananda Hirananda Vatsyayan, who wrote as Agyeya, was a bomb-maker for the Hindustan Socialist Republican Association before he was a poet, and served in the British Indian Army before he became modern Hindi literature’s most formidable editor. Akshaya Mukul reconstructs all of these lives from an enormous personal archive, and in doing so writes a history of twentieth-century Hindi letters — its quarrels, its patronage, its politics — through the one figure who was present at almost every turn of it.
  reviews:
