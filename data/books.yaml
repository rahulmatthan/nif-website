- slug: "how-india-became-democratic"
  title: "How India Became Democratic: Citizenship and the Making of the Universal Franchise"
  author: "Ornit Shani"
  route: "prize"
  prize_year: 2019
  round: null
  joint: false
  translation: false
  theme: "politics"
  publisher: "Cambridge University Press"
  year: 2018
  isbn: "9781107188594"
  cover: "1629272225269-T52W4RCBKDPI8FG4DDVP/ORNIT_.jpg"
  buy_amazon: ""
  buy_publisher: ""
  short_description: "How the electoral roll was built before the Constitution was adopted, and how the bureaucratic labour of registration produced Indian democratic citizenship."
  description: |-
    Before India had a Constitution it had an electoral roll. Ornit Shani tells the story of the two years in which officials across a partitioned, displaced, barely governed country set about registering every adult as a voter — arguing about refugees, about women recorded only as somebody’s wife, about who counted as belonging. Her claim is that universal franchise was not conferred by the Constitution but produced by this bureaucratic labour, and that Indians learned to be citizens by insisting on being counted.
  reviews:
    - publication: "Journal of Democracy"
      reviewer: "Šumit Ganguly"
      date: "July 2018"
      quote: "It is built on such carefully compiled evidence, in concert with a lucid and compelling argument."
      url: "https://www.journalofdemocracy.org/articles/enrolling-india/"
    - publication: "Pacific Affairs"
      reviewer: "Gilles Verniers"
      date: "2019"
      quote: "This is a book about how India operationalized its democracy, a story that, astonishingly, has not been told before by historians."
      url: "https://pacificaffairs.ubc.ca/book-reviews/how-india-became-democratic-citizenship-and-the-making-of-the-universal-franchise-by-ornit-shani/"
  awards: []

