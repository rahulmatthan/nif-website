  buy_publisher: ""
  short_description: ""
  description: |-
    Neha Dixit followed one woman for more than a decade. Syeda X fled Banaras after the riots of the early 1990s and has since done some fifty different kinds of piece-work in west Delhi — shelling almonds, stitching footballs, rolling incense, assembling toys. The book is an account of informal labour and of a Muslim working life in north India, built from the accumulated detail that only that kind of patience produces.
