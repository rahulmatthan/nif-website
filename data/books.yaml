- slug: "engineering-a-nation"
  title: "Engineering a Nation: The Life and Career of M. Visvesvaraya"
  author: "Aparajith Ramnath"
  route: "prize"
  prize_year: 2025
  round: null
  joint: false
  translation: false
  theme: "biography"
  publisher: "Viking (Penguin Random House India)"
  year: 2024
  isbn: "978-0-670-09050-1"
  cover: "69c65939-9030-4052-a960-c7aac587610f/Aparajith_winner+creative+for+website-01.jpg"
  buy_amazon: ""
  buy_publisher: ""
  short_description: "A biography of the engineer, administrator and Diwan of Mysore whose career maps the arrival of technical expertise as a form of Indian public authority."
  description: |-
    M. Visvesvaraya is remembered in the way that founding figures usually are — as a name on dams, reservoirs, colleges and a public holiday. This biography puts the man back inside his century. Trained as an engineer in the Bombay Presidency, he built irrigation works across western India, served as Diwan of Mysore, and spent his long later life arguing that India could not become a modern country without deliberately manufacturing its own technical class. Ramnath follows that argument through Visvesvaraya’s career and shows how engineering became, in his hands, a claim to public authority — and how the state he helped build absorbed the claim.
  reviews:
    - publication: "The India Forum"
      reviewer: "Aashique Ahmed Iqbal"
      date: "July 2025"
      quote: "Engineering a Nation is without a doubt the most comprehensive survey of the life of Visvesvaraya."
      url: "https://www.theindiaforum.in/book-reviews/indias-visionary-engineer"
  awards: []

- slug: "a-part-apart"
  title: "A Part Apart: The Life and Thought of B.R. Ambedkar"
  author: "Ashok Gopal"
  route: "prize"
  prize_year: 2024
  round: null
  joint: false
  translation: false
  theme: "biography"
  publisher: "Navayana"
  year: 2023
  isbn: "978-81-95838-51-6"
  cover: ""
  buy_amazon: "https://www.amazon.in/Part-Apart-Life-Thought-Ambedkar/dp/8195838510"
  buy_publisher: ""
  short_description: "A full-length intellectual biography of Ambedkar, reading his writing in Marathi alongside his English work to recover the shape of his thought."
  description: |-
    Most accounts of B.R. Ambedkar read only his English writing. Ashok Gopal reads the Marathi too — the journalism, the speeches, the pamphlets addressed to an audience that shared his language and his exclusion — and the Ambedkar who emerges is more restless and more difficult than the constitutional draftsman of the textbooks. Across nearly a thousand pages the book traces a mind working out, over four decades, what emancipation would actually require: not only law, but religion, economics, and a refusal of the terms on which caste society offered him inclusion.
  reviews:
    - publication: "The India Forum"
      reviewer: "Prabodhan Pol"
      date: "April 2024"
      quote: "This book moves beyond being a stereotypical description of Ambedkar's life and offers thought-provoking insights."
      url: "https://www.theindiaforum.in/book-reviews/insightful-account-life-and-work-br-ambedkar"
  awards: []

- slug: "writer-rebel-soldier-lover"
