- slug: "mobilizing-the-marginalized"
  title: "Mobilizing the Marginalized: Ethnic Parties Without Ethnic Movements"
  author: "Amit Ahuja"
  route: "prize"
  prize_year: 2020
  round: null
  joint: true
  translation: false
  theme: "caste"
  publisher: "Oxford University Press"
  year: 2019
  isbn: "9780190916428"
  cover: "1629272153670-E027JV6Z0HGBT3GVPDS3/AMIT+AHUJA+%281%29.jpg"
  buy_amazon: ""
  buy_publisher: ""
  short_description: "Why Dalit parties succeed where social movements have been weak, and fail where they have been strong. Joint winner."
  description: |-
    Why do Dalit parties do well in some Indian states and badly in others? Amit Ahuja’s answer inverts the usual expectation. Where Dalit social movements were strongest, ethnic parties have been weakest — because movements changed the terms of politics for everyone, leaving less for a party to claim. Built on fieldwork and survey data across four states, the book is a study of what social mobilisation does to electoral mobilisation, and vice versa.
  reviews:
    - publication: "Outlook India"
      reviewer: "Durdanah Masoodi"
      date: "July 2023"
      quote: "The book 'Mobilizing the Marginalized' by Amit Ahuja is one of the most profound books concerning the field of comparative politics."
      url: "https://www.outlookindia.com/books/book-review-mobilizing-the-marginalized-weekender_story-306282"
  awards: []

