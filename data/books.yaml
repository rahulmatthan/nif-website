- slug: "the-chipko-movement"
  title: "The Chipko Movement: A People’s History"
  author: "Shekhar Pathak, translated from the Hindi by Manisha Chaudhry"
  route: "prize"
  prize_year: 2022
  round: null
  joint: false
  translation: true
  theme: "environment"
  publisher: "Permanent Black"
  year: 2021
  isbn: "978-81-7824-555-3"
  cover: "8ec3d4c9-f736-4718-8250-c596f921101d/22+Winner.jpg"
  buy_amazon: ""
  buy_publisher: ""
  short_description: "The definitive account of the Himalayan forest movement, written by a historian who walked its villages for four decades."
  description: |-
    Chipko is one of the few Indian social movements the world has heard of, and one of the most thoroughly mythologised. Shekhar Pathak walked the Himalayan villages where it happened for four decades before writing this book, and the history he produces is denser and more argumentative than the parable. It restores the local politics, the labour disputes and the long prior tradition of forest resistance that made the movement possible, and it insists that the people who hugged the trees had reasons of their own.
  reviews:
    - publication: "The Book Review (India)"
      reviewer: "Lokesh Ohri"
      date: "February 2021"
      quote: "Shekhar Pathak catches every nuance of the people's struggle for their environment and contextualizes events contingent upon it like no other author could have."
      url: "https://www.thebookreviewindia.org/a-unique-ecological-movement/"
  awards: []

