  isbn: ""
  cover: "8ec3d4c9-f736-4718-8250-c596f921101d/22+Winner.jpg"
  buyAmazon: ""
  buyPublisher: ""
  shortDescription: "The definitive account of the Himalayan forest movement, written by a historian who walked its villages for four decades."
  description: |-
    Chipko is one of the few Indian social movements the world has heard of, and one of the most thoroughly mythologised. Shekhar Pathak walked the Himalayan villages where it happened for four decades before writing this book, and the history he produces is denser and more argumentative than the parable. It restores the local politics, the labour disputes and the long prior tradition of forest resistance that made the movement possible, and it insists that the people who hugged the trees had reasons of their own.
  reviews: []
  awards: []

