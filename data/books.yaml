- slug: "how-india-became-democratic"
  title: "How India Became Democratic: Citizenship and the Making of the Universal Franchise"
  author: "Ornit Shani"
  route: "prize"
  prizeYear: 2019
  round: null
  joint: false
  translation: false
  theme: "politics"
  publisher: ""
  year: null
  isbn: ""
  cover: "1629272225269-T52W4RCBKDPI8FG4DDVP/ORNIT_.jpg"
  buyAmazon: ""
  buyPublisher: ""
  shortDescription: "How the electoral roll was built before the Constitution was adopted, and how the bureaucratic labour of registration produced Indian democratic citizenship."
  description: |-
    Before India had a Constitution it had an electoral roll. Ornit Shani tells the story of the two years in which officials across a partitioned, displaced, barely governed country set about registering every adult as a voter — arguing about refugees, about women recorded only as somebody’s wife, about who counted as belonging. Her claim is that universal franchise was not conferred by the Constitution but produced by this bureaucratic labour, and that Indians learned to be citizens by insisting on being counted.
  reviews: []
  awards: []

- slug: "when-crime-pays"
