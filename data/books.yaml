  buy_amazon: ""
  buy_publisher: ""
  short_description: "Why parties field candidates facing criminal charges, and why voters elect them. The first winner of the prize."
  description: |-
    A third of India’s legislators face criminal charges, and voters know it. Milan Vaishnav’s book asks why they are elected anyway, and finds the answer in the cost of elections and the weakness of the state: parties need candidates who can self-finance, and voters in places where the state does not deliver may prefer a candidate who can get things done by other means. The first winner of the NIF Book Prize.
  reviews:
