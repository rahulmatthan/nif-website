  buyAmazon: ""
  buyPublisher: ""
  shortDescription: "Why Dalit parties succeed where social movements have been weak, and fail where they have been strong. Joint winner."
  description: |-
    Why do Dalit parties do well in some Indian states and badly in others? Amit Ahuja’s answer inverts the usual expectation. Where Dalit social movements were strongest, ethnic parties have been weakest — because movements changed the terms of politics for everyone, leaving less for a party to claim. Built on fieldwork and survey data across four states, the book is a study of what social mobilisation does to electoral mobilisation, and vice versa.
  reviews: []
  awards: []

