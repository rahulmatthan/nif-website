  buyAmazon: ""
  buyPublisher: ""
  shortDescription: "A biography of the engineer, administrator and Diwan of Mysore whose career maps the arrival of technical expertise as a form of Indian public authority."
  description: |-
    M. Visvesvaraya is remembered in the way that founding figures usually are — as a name on dams, reservoirs, colleges and a public holiday. This biography puts the man back inside his century. Trained as an engineer in the Bombay Presidency, he built irrigation works across western India, served as Diwan of Mysore, and spent his long later life arguing that India could not become a modern country without deliberately manufacturing its own technical class. Ramnath follows that argument through Visvesvaraya’s career and shows how engineering became, in his hands, a claim to public authority — and how the state he helped build absorbed the claim.
  reviews: []
  awards: []

- slug: "a-part-apart"
  title: "A Part Apart: The Life and Thought of B.R. Ambedkar"
  author: "Ashok Gopal"
  route: "prize"
  prizeYear: 2024
  round: null
  joint: false
  translation: false
  theme: "biography"
  publisher: ""
  year: null
  isbn: ""
  cover: ""
  buyAmazon: "https://www.amazon.in/Part-Apart-Life-Thought-Ambedkar/dp/8195838510"
  buyPublisher: ""
  shortDescription: "A full-length intellectual biography of Ambedkar, reading his writing in Marathi alongside his English work to recover the shape of his thought."
  description: |-
    Most accounts of B.R. Ambedkar read only his English writing. Ashok Gopal reads the Marathi too — the journalism, the speeches, the pamphlets addressed to an audience that shared his language and his exclusion — and the Ambedkar who emerges is more restless and more difficult than the constitutional draftsman of the textbooks. Across nearly a thousand pages the book traces a mind working out, over four decades, what emancipation would actually require: not only law, but religion, economics, and a refusal of the terms on which caste society offered him inclusion.
  reviews: []
  awards: []

