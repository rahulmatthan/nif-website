  shortDescription: "The first full biography of Dadabhai Naoroji, drawing on an archive of thirty thousand documents to recover the making of Indian economic nationalism."
  description: |-
    Dadabhai Naoroji gave Indian nationalism its first economic argument — the drain of wealth — and became the first Indian elected to the British House of Commons. Dinyar Patel worked through an archive of some thirty thousand documents to produce the first full biography, and it reframes Naoroji as a political strategist rather than a venerable ancestor: a man who spent half a century learning how to make imperial institutions work against themselves.
  reviews: []
