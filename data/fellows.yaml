translation:
  - round: null
    year: 2026
    announced: "2026"
    fellows:
      - name: "Jayasree Kalathil"
        work: |-
          Translating <em>Adimamakka</em> (Children of the Enslaved), the Malayalam autobiography of the Adivasi land-rights activist C.K. Janu — a history of the indigenous movement for land rights in Kerala, and of a political struggle largely absent from the record of the state's celebrated development model.
      - name: "Murali Ranganathan"
        work: |-
          Translating <em>Tibet Mein Savva Varsh</em> by Rahul Sankrityayan, first published in 1934: an account of his travels in search of the Buddha between December 1928 and June 1930, moving incognito through India, Nepal and Tibet at a time when foreign entry was restricted.
      - name: "Shefali Jha"
        work: |-
          Translating Ibrahim Hussain Jalis's <em>Do Mulk, Ek Kahani</em> — subjective journalism chronicling the making of postcolonial South Asia and the final years of the princely state of Hyderabad, seen through the eyes of a young Urdu writer.
      - name: "Mini Chandran"
        work: ""
